{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | BikeStore</title>
    <link rel="stylesheet" href="{% static 'motosapp/estilo.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="{% url 'home' %}" class="brand">Bike<span>Store</span></a>
        <nav class="nav-links">
          <a href="{% url 'home' %}">Inicio</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="form-shell login-shell">
        <div class="form-header">
          <h1>Iniciar sesión</h1>
        </div>

        <div class="form-body">
          {% if form.errors %}
          <div class="validation-error" role="alert">
            El usuario o la contraseña no son correctos.
          </div>
          {% endif %}

          <form method="post" class="login-form">
            {% csrf_token %}
            <div class="form-group">
              <label for="id_username">Usuario</label>
              <input
                type="text"
                name="username"
                id="id_username"
                autocomplete="username"
                required
                autofocus
              />
            </div>

            <div class="form-group">
              <label for="id_password">Contraseña</label>
              <input
                type="password"
                name="password"
                id="id_password"
                autocomplete="current-password"
                required
              />
            </div>

            <input type="hidden" name="next" value="{{ next }}" />

            <div class="form-actions">
              <button type="submit">Entrar</button>
              <a href="{% url 'home' %}" class="link-button">Volver</a>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
